<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carátula - Libros Contables</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f7f5;
            color: #263029;
        }

        .portada {
            min-height: 100vh;
            background: linear-gradient(135deg, #26372d, #385442);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .portada-contenido {
            width: min(760px, 94%);
            padding: 50px 30px;
            border: 1px solid #ffffff35;
            border-radius: 18px;
            background: #ffffff0d;
            box-shadow: 0 12px 35px #00000025;
        }

        .etiqueta {
            display: inline-block;
            background: #b88945;
            color: white;
            padding: 7px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 {
            color: white;
            font-size: clamp(2.4rem, 7vw, 4.5rem);
            margin-bottom: 15px;
        }

        h2 {
            color: white;
            font-size: 1.5rem;
            font-weight: normal;
            margin-bottom: 20px;
        }

        p {
            color: #e8eee9;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .boton {
            display: inline-block;
            background: #b88945;
            color: white;
            text-decoration: none;
            padding: 13px 24px;
            border-radius: 8px;
            font-weight: bold;
        }

        .boton:hover {
            background: #9f7438;
        }

        @media (max-width: 480px) {
            .portada {
                padding: 20px;
            }

            .portada-contenido {
                padding: 40px 20px;
            }

            h1 {
                font-size: 2.2rem;
            }

            h2 {
                font-size: 1.2rem;
            }

            p {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <section class="portada">

        <div class="portada-contenido">

            <span class="etiqueta">
                TRABAJO ACADÉMICO
            </span>

            <h1>
                Libros Contables en el Perú
            </h1>

            <h2>
                Línea de tiempo interactiva
            </h2>

            <p>
                Conoce la evolución de los libros contables,
                su regulación y el paso del registro físico
                al registro electrónico.
            </p>

            <a href="TA1.HTML" class="boton">
                Ingresar a la línea de tiempo →
            </a>

        </div>

    </section>

</body>
</html>
